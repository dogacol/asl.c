project_title: "Rough Cut"
input_dir: "./input"
work_dir: "./work"
output_dir: "./output"

model_name: "mlx-community/gemma-4-e4b-it-4bit"
fallback_model_name: "mlx-community/gemma-4-e2b-it-4bit"

target_duration_sec: 90
style_prompt: "poetic observational montage"

scene_threshold: 27.0
max_video_window_sec: 30
frame_sample_fps: 1
max_segments_per_clip: 8
min_segment_duration_sec: 1.0

transcript_enabled: true
preview_render_enabled: false
watch_mode: false

fcpxml_version: "1.11"
proxy_long_edge: 960

# Scoring weights
weight_keep_probability: 0.30
weight_clarity: 0.20
weight_visual_quality: 0.15
weight_emotional: 0.15
weight_action: 0.10
weight_novelty: 0.10

# Logging
log_level: "INFO"
