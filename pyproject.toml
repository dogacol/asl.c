[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roughcut-fcpx"
version = "0.1.0"
description = "Local rough-cut generator: analyzes clips with Gemma 4 on Apple Silicon and writes FCPXML for Final Cut Pro"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "roughcut-fcpx contributors" }]

dependencies = [
    "pydantic>=2.5,<3",
    "lxml>=5.1,<6",
    "pyyaml>=6.0,<7",
    "click>=8.1,<9",
    "scenedetect[opencv]>=0.6,<1",
    "mlx-whisper>=0.4,<1",
    "mlx-vlm>=0.3,<1",
    "watchdog>=4.0,<5",
    "rich>=13.0,<14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    "ruff>=0.4,<1",
]

[project.scripts]
roughcut-fcpx = "roughcut_fcpx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
